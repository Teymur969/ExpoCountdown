.header{position:absolute;inset:58px 100px auto;display:flex;align-items:flex-start;justify-content:space-between;z-index:4}
.logo{width:191px;height:114px;object-fit:contain}
.live-clock{text-align:right;padding-top:9px}.live-clock .city{font-size:16px;letter-spacing:3px;font-weight:700;text-transform:uppercase}.local-time{font-size:35px;line-height:1.7;font-variant-numeric:tabular-nums}.local-date{font-size:16px;color:#555}
.intro{position:absolute;top:175px;left:250px;right:250px;text-align:center;z-index:3}
.eyebrow{font-size:16px;letter-spacing:5px;font-weight:700;margin:0 0 14px}.intro h1{font:62px/1.05 Expo,Arial,sans-serif;letter-spacing:0;margin:0}.target{display:flex;justify-content:center;align-items:center;gap:20px;margin:14px 0 0;font-size:22px;letter-spacing:.5px}.target i{width:5px;height:5px;background:var(--pink);border-radius:50%;display:inline-block}.target .zone{font-size:19px;color:#555}
.heading-translation{margin:10px 0 0;font-size:19px;line-height:1.4;color:#555}
.countdown{position:absolute;left:545px;right:545px;top:387px;text-align:center;z-index:3}
.working-panel{background:var(--pink);color:white;border-radius:92px 32px 92px 32px;padding:26px 26px 28px;min-height:368px;}
.working-translation{font-size:20px;line-height:1.4;color:var(--ink);margin:3px 0 0}
.calendar-countdown{margin-top:29px;display:flex;justify-content:center;align-items:baseline;gap:16px;white-space:nowrap;color:#444}
.calendar-caption{font-size:18px;font-weight:400}.calendar-values{display:flex;align-items:baseline;gap:13px;font-size:25px;font-variant-numeric:tabular-nums;font-weight:700}.calendar-values b{font-weight:700}.calendar-values .sep{color:var(--lilac);font-size:19px}.calendar-values .unit{font-size:18px;font-weight:400}.calendar-values .part{display:inline-flex;gap:6px;align-items:baseline}

.days-number{height:230px;display:flex;align-items:center;justify-content:center;font:288px/.82 Expo,Arial,sans-serif;letter-spacing:0;white-space:nowrap}
.digit{display:inline-flex;width:.79em;height:.94em;align-items:center;justify-content:center;position:relative}.digit.changed{animation:digit-in .48s cubic-bezier(.22,1,.36,1)}
@keyframes digit-in{0%{transform:translateY(9px);opacity:.45}100%{transform:translateY(0);opacity:1}}
.days-label{font-size:39px;line-height:1.2;font-weight:700;letter-spacing:5px;margin:8px 0 0;padding-left:5px}
.character{position:absolute;top:326px;width:740px;height:740px;object-fit:contain;z-index:2;filter:drop-shadow(0 22px 22px #0000000a);pointer-events:none;user-select:none;animation:float 8s ease-in-out infinite}
.rastko{left:-58px;animation-delay:-2s}.milica{right:-64px;animation-delay:-5s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-12px) rotate(.6deg)}}
.aura{position:absolute;width:670px;height:670px;border-radius:50%;top:325px;z-index:0;opacity:.52;filter:blur(12px)}.aura.left{left:-80px;background:radial-gradient(ellipse,#97d5cc77, #97d5cc08 62%,transparent 71%)}.aura.right{right:-65px;background:radial-gradient(ellipse,#ee4d9b55,#ee4d9b05 64%,transparent 72%)}
.pattern{position:absolute;z-index:1;width:430px;height:430px;object-fit:contain;mix-blend-mode:multiply;opacity:.17;pointer-events:none}.pattern.left{left:-162px;top:460px;transform:rotate(-10deg)}.pattern.right{right:-185px;top:435px;transform:rotate(7deg)}
.message-wrap{position:absolute;left:540px;right:540px;top:865px;text-align:center;z-index:4}.message{font:37px/1.2 Expo,Arial,sans-serif;margin:0;min-height:96px;transition:opacity .5s,transform .5s}.message.leaving{opacity:0;transform:translateY(8px)}.message span{display:block}.message .accent{color:var(--lilac)}
.footer{position:absolute;bottom:47px;left:0;right:0;text-align:center;z-index:4;font-size:15px;letter-spacing:5px;font-weight:700}.footer::before{content:'';display:block;width:62px;height:5px;background:linear-gradient(90deg,var(--pink),var(--lilac),var(--teal),var(--yellow));border-radius:10px;margin:0 auto 20px}
.bottom-wash{position:absolute;left:0;right:0;bottom:-220px;height:320px;border-radius:50% 50% 0 0;background:linear-gradient(100deg,#97d5cc66,#7781b829 37%,#ee4d9b3b 67%,#e7e62980);filter:blur(24px);z-index:0}
.controls{position:fixed;bottom:22px;right:22px;z-index:20;display:flex;gap:8px;opacity:0;transition:opacity .35s;pointer-events:none}.controls.show,.controls:focus-within{opacity:1;pointer-events:auto}.controls button{background:#fffefef2;color:#202020;border:1px solid #dadada;box-shadow:0 4px 20px #0000000d;cursor:pointer;padding:12px 16px;border-radius:30px;font-size:14px;display:flex;align-items:center;gap:8px}.controls button:hover{background:var(--yellow)}.controls svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7}.hint{position:fixed;bottom:25px;left:25px;z-index:20;background:#171717;color:#fff;border-radius:28px;padding:13px 20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .35s}.hint.visible{opacity:1}
body.cursor-hidden{cursor:none}body.cursor-hidden .controls{cursor:auto}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
body.motion-off *,body.motion-off *::before,body.motion-off *::after{animation:none!important;transition:none!important} .finished .intro h1{font-size:62px}.finished .days-label{font-size:32px;letter-spacing:3px}.finished .days-number{font-size:140px}.finished .calendar-countdown{visibility:hidden}.finished .message{font-size:38px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* Rearrange the same display for portrait screens. */
@media(max-aspect-ratio:1/1){
.stage{width:1080px;height:1740px}.header{inset:68px 70px auto}.logo{width:198px;height:118px}.live-clock .city{font-size:20px}.local-time{font-size:40px}.local-date{font-size:21px}
.intro{top:290px;left:40px;right:40px}.eyebrow{font-size:20px}.intro h1{font-size:55px}.heading-translation{font-size:25px;margin-top:14px}.target{font-size:26px;gap:18px;margin-top:22px}.target .zone{font-size:23px}
.countdown{top:526px;left:85px;right:85px}.working-panel{padding:35px 20px 37px;min-height:424px;border-radius:92px 32px}.days-number{font-size:320px;height:266px}.days-label{font-size:42px;margin:15px 0 0}.working-translation{font-size:25px;margin-top:8px}.calendar-countdown{flex-direction:column;align-items:center;gap:12px;margin-top:26px}.calendar-caption{font-size:25px}.calendar-values{font-size:32px;gap:18px}.calendar-values .unit{font-size:25px}
.character{top:1093px;width:560px;height:560px}.rastko{left:-66px}.milica{right:-73px}.message-wrap{top:1355px;left:320px;right:320px}.message{font-size:34px;line-height:1.3;min-height:130px}.footer{bottom:49px;font-size:20px;letter-spacing:5px}.aura{top:1070px;width:530px;height:620px}.pattern.left{top:1180px}.pattern.right{top:1180px}.finished .intro h1{font-size:55px}.finished .days-number{font-size:145px}.finished .message{font-size:34px}
}
</style>

   <span class="part"><b id="calendar-days">---</b><span class="unit" id="calendar-day-label">dana</span></span><span class="sep" aria-hidden="true">·</span>
   <span class="part"><b id="hours">--</b><span class="unit">h</span></span><span class="sep" aria-hidden="true">·</span>
   <span class="part"><b id="minutes">--</b><span class="unit">min</span></span><span class="sep" aria-hidden="true">·</span>
   <span class="part"><b id="seconds">--</b><span class="unit">s</span></span>
  </div>
 </div>
</section>
<div class="message-wrap"><p class="message" id="message"><span>JEDAN TIM.</span><span class="accent">JEDAN CILJ.</span></p></div>
<div class="bottom-wash" aria-hidden="true"></div>
<footer class="footer">IGRAJ ZA ČOVEČANSTVO</footer>
<p class="sr-only" id="announcement" role="status" aria-live="polite"></p>
<noscript><p style="position:absolute;top:650px;left:400px;right:400px;text-align:center;background:white;padding:30px;z-index:10">Uključite JavaScript da biste pokrenuli odbrojavanje.</p></noscript>
</main>
<div class="controls show" id="controls" aria-label="Podešavanja prikaza">
 <button type="button" id="motion-button" aria-pressed="false" title="Pauziraj animaciju (M)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg><span id="motion-label">Pauziraj animaciju</span></button>
 <button type="button" id="fullscreen-button" title="Ceo ekran (F)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span id="fullscreen-label">Ceo ekran</span></button>
</div>
<div class="hint" id="hint" role="status"></div>
<script>
'use strict';
/* EDIT THE EVENT HERE. Explicit +02:00 = Belgrade summer time on 15 May 2027.
   Using an absolute timestamp makes the countdown identical in every time zone.
   It is deliberately recalculated from Date.now() every tick to avoid timer drift. */
const CONFIG = Object.freeze({
  target: '2027-05-15T10:00:00+02:00',
  timeZone: 'Europe/Belgrade',
  messageInterval: 14000,
  messages: [ ['JEDAN TIM.', 'JEDAN CILJ.'], ['SVAKI DAN NAS', 'PRIBLIŽAVA.'], ['SPREMNI DA', 'DOČEKAMO SVET.'] ]
});
const targetMs = Date.parse(CONFIG.target);
const $ = id => document.getElementById(id);
const units = ['hours','minutes','seconds'];
const timeFormatter = new Intl.DateTimeFormat('sr-Latn-RS',{timeZone:CONFIG.timeZone,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
const dateFormatter = new Intl.DateTimeFormat('sr-Latn-RS',{timeZone:CONFIG.timeZone,weekday:'long',day:'2-digit',month:'long',year:'numeric'});
// Calendar date arithmetic is anchored to Belgrade, not the device's time zone.
const civilDateFormatter = new Intl.DateTimeFormat('en-GB',{timeZone:CONFIG.timeZone,year:'numeric',month:'2-digit',day:'2-digit'});
function civilDayNumber(timestamp) {
 const p=Object.fromEntries(civilDateFormatter.formatToParts(timestamp).map(part=>[part.type,part.value]));
 return Math.floor(Date.UTC(Number(p.year),Number(p.month)-1,Number(p.day))/86400000);
}
const targetCivilDay = civilDayNumber(targetMs);
/* Count Monday–Friday calendar dates from today (inclusive) to the event date
   (exclusive). The current weekday remains counted until midnight in Belgrade.
   Public holidays are intentionally not removed. UTC is only used for civil-date
   ordinals, so 23/25-hour daylight-saving days do not affect the weekday count. */
function getWorkingDays(nowMs) {
 if(nowMs>=targetMs)return 0;
 const first=civilDayNumber(nowMs),span=Math.max(0,targetCivilDay-first);
 let count=Math.floor(span/7)*5;
 for(let i=0;i<span%7;i++){
  const weekday=((first+Math.floor(span/7)*7+i+4)%7+7)%7;
  if(weekday!==0&&weekday!==6)count++;
 }
 return count;
}
function workingDayLabel(count) {
 const last=count%10,lastTwo=count%100;
 if(last===1&&lastTwo!==11)return 'RADNI DAN';
 if(last>=2&&last<=4&&!(lastTwo>=12&&lastTwo<=14))return 'RADNA DANA';
 return 'RADNIH DANA';
}
function calendarDayLabel(count){return count%10===1&&count%100!==11?'dan':'dana';}
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
let motionPaused = reducedMotion.matches;
let lastMessage = 0, lastAnnouncement = '', completed = false, wakeLock = null;
let hideTimer, hintTimer, messageTimer;
function getRemaining(nowMs) {
 const total = Math.max(0, Math.ceil((targetMs-nowMs)/1000));
 return {days:Math.floor(total/86400),hours:Math.floor(total%86400/3600),minutes:Math.floor(total%3600/60),seconds:total%60,total};
}
function renderDigits(id,value) {
 const el=$(id), chars=String(value).split('');
 if(el.children.length!==chars.length){el.replaceChildren(...chars.map(()=>{const s=document.createElement('span');s.className='digit';s.setAttribute('aria-hidden','true');return s;}));}
 chars.forEach((c,i)=>{const d=el.children[i];if(d.textContent!==c){d.textContent=c;d.classList.remove('changed');void d.offsetWidth;d.classList.add('changed');}});
 el.setAttribute('aria-label',value+' '+workingDayLabel(value).toLowerCase());
}
function showMessage(index) {
 const el=$('message');el.classList.add('leaving');
 clearTimeout(messageTimer);
 messageTimer=setTimeout(()=>{el.replaceChildren(...CONFIG.messages[index].map((line,i)=>{const s=document.createElement('span');s.textContent=line;if(i)s.className='accent';return s;}));el.classList.remove('leaving');},motionPaused?0:500);
}
function tick() {
 const now=Date.now(),remaining=getRemaining(now),workingDays=getWorkingDays(now);
 $('local-time').textContent=timeFormatter.format(now);
 $('local-date').textContent=dateFormatter.format(now);
 if(!completed){
  renderDigits('days',workingDays);
  units.forEach(key=>{$(key).textContent=String(remaining[key]).padStart(2,'0');});
  $('calendar-days').textContent=remaining.days;
  $('calendar-day-label').textContent=calendarDayLabel(remaining.days);
  $('days-label').textContent=workingDayLabel(workingDays);
  document.querySelector('.eyebrow').textContent=civilDayNumber(now)===targetCivilDay?'DANAS JE TAJ DAN':'SVET DOLAZI';
  const announce=workingDays+' '+workingDayLabel(workingDays).toLowerCase()+'. Ukupno do početka: '+remaining.days+' '+calendarDayLabel(remaining.days)+', '+remaining.hours+' h i '+remaining.minutes+' min.';
  if(announce!==lastAnnouncement){$('announcement').textContent=announce;lastAnnouncement=announce;}
  if(remaining.total===0){
   completed=true;clearTimeout(messageTimer);$('stage').classList.add('finished');
   document.querySelector('.eyebrow').textContent='SVET JE STIGAO';
   $('headline').textContent='OPERACIJE SU POČELE';$('heading-translation').textContent='Operations are live';
   $('days').textContent='KREĆEMO!';$('days').setAttribute('aria-label','Operacije su počele');
   $('days-label').textContent='15. MAJ 2027.';$('working-translation').textContent='Let’s welcome the world';
   $('message').classList.remove('leaving');$('message').innerHTML='<span>DOČEKAJMO</span><span class="accent">SVET ZAJEDNO.</span>';
   $('announcement').textContent='Operacije za EXPO 2027 su počele.';document.title='EXPO 2027 · Operacije su počele';
  } else if(!motionPaused){
   const next=Math.floor(now/CONFIG.messageInterval)%CONFIG.messages.length;
   if(next!==lastMessage){lastMessage=next;showMessage(next);}
  }
 }
}
function fitScreen(){const portrait=window.matchMedia('(max-aspect-ratio:1/1)').matches;const width=portrait?1080:1920,height=portrait?1740:1080;document.documentElement.style.setProperty('--scale',Math.min(window.innerWidth/width,window.innerHeight/height));}
function hint(text){$('hint').textContent=text;$('hint').classList.add('visible');clearTimeout(hintTimer);hintTimer=setTimeout(()=>$('hint').classList.remove('visible'),4500);}
function showControls(){document.body.classList.remove('cursor-hidden');$('controls').classList.add('show');clearTimeout(hideTimer);hideTimer=setTimeout(()=>{if(!$('controls').contains(document.activeElement)){$('controls').classList.remove('show');document.body.classList.add('cursor-hidden');}},4200);}
function applyMotion(){document.body.classList.toggle('motion-off',motionPaused);$('motion-button').setAttribute('aria-pressed',String(motionPaused));$('motion-label').textContent=motionPaused?'Nastavi animaciju':'Pauziraj animaciju';if(motionPaused){clearTimeout(messageTimer);$('message').classList.remove('leaving');}showControls();}
async function keepAwake(){if(!('wakeLock' in navigator)||document.visibilityState!=='visible'||!document.fullscreenElement)return;try{if(!wakeLock||wakeLock.released)wakeLock=await navigator.wakeLock.request('screen');}catch(_){/* TV power settings remain authoritative. */}}
async function toggleFullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen();}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();await keepAwake();}else{hint('Uključite prikaz preko celog ekrana u pregledaču.');}}catch(_){hint('Pritisnite F11 ili uključite ceo ekran u pregledaču.');}showControls();}
$('fullscreen-button').addEventListener('click',toggleFullscreen);
$('motion-button').addEventListener('click',()=>{motionPaused=!motionPaused;applyMotion();});
document.addEventListener('fullscreenchange',()=>{$('fullscreen-label').textContent=document.fullscreenElement?'Izađi iz celog ekrana':'Ceo ekran';if(document.fullscreenElement)keepAwake();else if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null;}fitScreen();});
document.addEventListener('keydown',event=>{if(event.altKey||event.ctrlKey||event.metaKey)return;showControls();if(event.key.toLowerCase()==='f'){event.preventDefault();toggleFullscreen();}if(event.key.toLowerCase()==='m'){event.preventDefault();motionPaused=!motionPaused;applyMotion();}});
document.addEventListener('pointermove',showControls,{passive:true});document.addEventListener('pointerdown',showControls,{passive:true});document.addEventListener('focusin',showControls);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){tick();keepAwake();}});window.addEventListener('pageshow',tick);window.addEventListener('resize',fitScreen);
if(reducedMotion.addEventListener)reducedMotion.addEventListener('change',e=>{motionPaused=e.matches;applyMotion();});
fitScreen();applyMotion();tick();
/* One aligned timer, no accumulation of setInterval drift. */
function scheduleTick(){setTimeout(()=>{tick();scheduleTick();},1000-Date.now()%1000+12);}scheduleTick();
</script>
</body>
</html>
